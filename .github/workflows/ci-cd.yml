name: CI/CD

# One pipeline: lint + test run on every push/PR; deploy runs ONLY on a push to
# main or a v* tag, and ONLY after lint and test both pass (needs + gated).
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write        # for Workload Identity Federation (deploy job)

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff==0.7.4
      - name: Ruff check
        run: ruff check .
      - name: ShellCheck (errors only)
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error
          scandir: '.'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest==8.3.3
      - name: Run unit tests
        run: pytest -q

  deploy:
    needs: [lint, test]            # <-- only runs if BOTH pass
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (keyless, via WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy news-fetcher
        run: |
          gcloud run deploy news-fetcher \
            --project="$PROJECT_ID" --region="$REGION" \
            --source=services/news-fetcher \
            --service-account="news-fetcher-sa@${PROJECT_ID}.iam.gserviceaccount.com" \
            --no-allow-unauthenticated \
            --set-env-vars="SOURCE_BUCKET=source_raw_123456,INCOMING_PREFIX=incoming/" \
            --set-secrets="TAVILY_API_KEY=tavily-api-key:latest" \
            --quiet

      - name: Deploy raw-file-processor
        run: |
          gcloud run deploy raw-file-processor \
            --project="$PROJECT_ID" --region="$REGION" \
            --source=services/raw-file-processor \
            --service-account="raw-processor-sa@${PROJECT_ID}.iam.gserviceaccount.com" \
            --no-allow-unauthenticated \
            --set-env-vars="DEST_BUCKET=destination_raw_123456,PROCESSED_PREFIX=processed/" \
            --quiet

      - name: Summary
        run: |
          echo "### Deployed ✅ (lint + tests passed)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ref: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          gcloud run services list --project="$PROJECT_ID" --region="$REGION" \
            --format="value(metadata.name,status.url)" >> "$GITHUB_STEP_SUMMARY"
